<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-Pendulum Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1a1a1a;
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
        }
        
        canvas {
            border: 2px solid #444;
            border-radius: 8px;
            background: #000;
        }
        
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        label {
            font-size: 14px;
            color: #aaa;
        }
        
        input[type="range"] {
            width: 150px;
        }
        
        button {
            padding: 10px 20px;
            background: #4a9eff;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        
        button:hover {
            background: #3a8eef;
        }
        
        a {
            text-decoration: none;
            color: #4a9eff;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <a href="index.html">← Back to Home</a>
    <h1>N-Pendulum Simulator</h1>
    <canvas id="canvas" width="800" height="600"></canvas>
    
    <div class="controls">
        <div class="control-group">
            <label>Number of Pendulums (n): <span id="nVal">2</span></label>
            <input type="range" id="nPendulum" min="1" max="5" step="1" value="2">
        </div>
        <div class="control-group">
            <label>Length: <span id="lengthVal">100</span>px</label>
            <input type="range" id="length" min="50" max="150" step="10" value="100">
        </div>
        <div class="control-group">
            <label>Mass: <span id="massVal">10</span></label>
            <input type="range" id="mass" min="5" max="20" step="1" value="10">
        </div>
        <button id="resetBtn">Reset</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const g = 9.81; // gravity
        let n = 2; // number of pendulums
        let segmentLength = 100;
        let segmentMass = 10;
        
        // State: angles and angular velocities
        let angles = [];
        let angularVels = [];
        
        const originX = canvas.width / 2;
        const originY = 100;
        
        function initPendulum() {
            angles = [];
            angularVels = [];
            
            for (let i = 0; i < n; i++) {
                // Start with slight offset from vertical
                angles.push(Math.PI / 2 + (i * 0.1));
                angularVels.push(0);
            }
        }
        
        // Calculate derivatives for Runge-Kutta integration
        function derivatives(angles, angularVels) {
            const dAngles = [...angularVels];
            const dAngularVels = new Array(n).fill(0);
            
            // Simplified Lagrangian mechanics for n-pendulum
            // This uses approximations that work well for small to medium n
            for (let i = 0; i < n; i++) {
                let num = 0;
                let den = 0;
                
                // Gravitational torque
                num -= (n - i) * segmentMass * g * Math.sin(angles[i]);
                
                // Coupling with other segments
                for (let j = 0; j < n; j++) {
                    if (j > i) {
                        num -= segmentMass * segmentLength * angularVels[j] * angularVels[j] * Math.sin(angles[i] - angles[j]);
                    }
                    if (j < i) {
                        num += segmentMass * segmentLength * angularVels[j] * angularVels[j] * Math.sin(angles[j] - angles[i]);
                    }
                }
                
                // Moment of inertia
                den = (n - i) * segmentMass * segmentLength;
                
                dAngularVels[i] = num / den;
            }
            
            return { dAngles, dAngularVels };
        }
        
        // Runge-Kutta 4th order integration
        function integrate(dt) {
            // k1
            const k1 = derivatives(angles, angularVels);
            
            // k2
            const angles2 = angles.map((a, i) => a + k1.dAngles[i] * dt / 2);
            const vels2 = angularVels.map((v, i) => v + k1.dAngularVels[i] * dt / 2);
            const k2 = derivatives(angles2, vels2);
            
            // k3
            const angles3 = angles.map((a, i) => a + k2.dAngles[i] * dt / 2);
            const vels3 = angularVels.map((v, i) => v + k2.dAngularVels[i] * dt / 2);
            const k3 = derivatives(angles3, vels3);
            
            // k4
            const angles4 = angles.map((a, i) => a + k3.dAngles[i] * dt);
            const vels4 = angularVels.map((v, i) => v + k3.dAngularVels[i] * dt);
            const k4 = derivatives(angles4, vels4);
            
            // Update
            for (let i = 0; i < n; i++) {
                angles[i] += (k1.dAngles[i] + 2*k2.dAngles[i] + 2*k3.dAngles[i] + k4.dAngles[i]) * dt / 6;
                angularVels[i] += (k1.dAngularVels[i] + 2*k2.dAngularVels[i] + 2*k3.dAngularVels[i] + k4.dAngularVels[i]) * dt / 6;
            }
        }
        
        function draw() {
            // Clear
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Calculate positions of each segment
            let x = originX;
            let y = originY;
            
            const positions = [{x, y}];
            
            for (let i = 0; i < n; i++) {
                x += segmentLength * Math.sin(angles[i]);
                y += segmentLength * Math.cos(angles[i]);
                positions.push({x, y});
            }
            
            // Draw rods
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(positions[0].x, positions[0].y);
            for (let i = 1; i <= n; i++) {
                ctx.lineTo(positions[i].x, positions[i].y);
            }
            ctx.stroke();
            
            // Draw pivot point
            ctx.beginPath();
            ctx.arc(originX, originY, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#666';
            ctx.fill();
            
            // Draw masses
            for (let i = 1; i <= n; i++) {
                const radius = segmentMass;
                
                // Shadow
                ctx.beginPath();
                ctx.arc(positions[i].x + 2, positions[i].y + 2, radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fill();
                
                // Ball
                ctx.beginPath();
                ctx.arc(positions[i].x, positions[i].y, radius, 0, Math.PI * 2);
                
                // Gradient for 3D effect
                const gradient = ctx.createRadialGradient(
                    positions[i].x - radius * 0.3,
                    positions[i].y - radius * 0.3,
                    0,
                    positions[i].x,
                    positions[i].y,
                    radius
                );
                
                const hue = (i / n) * 360;
                gradient.addColorStop(0, `hsl(${hue}, 70%, 70%)`);
                gradient.addColorStop(1, `hsl(${hue}, 70%, 40%)`);
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }
        
        function animate() {
            // Multiple integration steps per frame for stability
            const dt = 0.01;
            for (let i = 0; i < 3; i++) {
                integrate(dt);
            }
            
            draw();
            requestAnimationFrame(animate);
        }
        
        // Controls
        document.getElementById('nPendulum').addEventListener('input', (e) => {
            n = parseInt(e.target.value);
            document.getElementById('nVal').textContent = n;
            initPendulum();
        });
        
        document.getElementById('length').addEventListener('input', (e) => {
            segmentLength = parseInt(e.target.value);
            document.getElementById('lengthVal').textContent = segmentLength;
        });
        
        document.getElementById('mass').addEventListener('input', (e) => {
            segmentMass = parseInt(e.target.value);
            document.getElementById('massVal').textContent = segmentMass;
        });
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            initPendulum();
        });
        
        // Click to disturb the pendulum
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            
            // Add some random perturbation
            for (let i = 0; i < n; i++) {
                angularVels[i] += (Math.random() - 0.5) * 2;
            }
        });
        
        // Initialize and start
        initPendulum();
        animate();
    </script>
</body>
</html>
