<!DOCTYPE html>
<html>
<head>
    <title>Media Demo</title>
    <link rel="stylesheet" href="css/media-style.css">
</head>
<body>
    <div class="container">
        <h1>Media Demo Page</h1>
        
        <h2>Image Example</h2>
        <p>Here's how to display an image:</p>
        
        <img src="images/phot.png" alt="Description of the image" class="demo-image">
        
        <p class="caption">This is a caption for the image above</p>
        
        <h2>Audio Example</h2>
        <p>Here's an audio player:</p>
        
        <audio controls class="audio-player">
            <source src="audio/stingrays.m4a" type="audio/mp4">
            Your browser does not support the audio element.
        </audio>
        
        <p class="audio-info">Sample audio file - click play to listen</p>
    
        
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
