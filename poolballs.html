<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Balls Physics</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1a1a1a;
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
        }
        
        canvas {
            border: 2px solid #444;
            border-radius: 8px;
            background: #0a4a2a;
            cursor: crosshair;
        }
        
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        label {
            font-size: 14px;
            color: #aaa;
        }
        
        input[type="range"] {
            width: 150px;
        }
        
        button {
            padding: 10px 20px;
            background: #4a9eff;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        
        button:hover {
            background: #3a8eef;
        }
        
        a {
            text-decoration: none;
            color: #4a9eff;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <a href="index.html">← Back to Home</a>
    <h1>Pool Balls Physics</h1>
    <canvas id="canvas" width="800" height="600"></canvas>
    
    <div class="controls">
        <div class="control-group">
            <label>Ball Count: <span id="countVal">8</span></label>
            <input type="range" id="ballCount" min="2" max="20" step="1" value="8">
        </div>
        <div class="control-group">
            <label>Speed: <span id="speedVal">3</span></label>
            <input type="range" id="speed" min="1" max="10" step="0.5" value="3">
        </div>
        <button id="resetBtn">Reset Balls</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let balls = [];
        let speedMultiplier = 1;
        
        const COLORS = [
            '#FFEB3B', '#FF5722', '#2196F3', '#4CAF50', 
            '#9C27B0', '#FF9800', '#00BCD4', '#E91E63',
            '#FFC107', '#8BC34A', '#673AB7', '#009688',
            '#FF6F00', '#C62828', '#1565C0', '#2E7D32'
        ];
        
        class Ball {
            constructor(x, y, vx, vy, radius, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = radius;
                this.color = color;
                this.mass = radius * radius; // Mass proportional to area
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                // Bounce off walls with perfect reflection
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx = Math.abs(this.vx);
                }
                if (this.x + this.radius > canvas.width) {
                    this.x = canvas.width - this.radius;
                    this.vx = -Math.abs(this.vx);
                }
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.vy = Math.abs(this.vy);
                }
                if (this.y + this.radius > canvas.height) {
                    this.y = canvas.height - this.radius;
                    this.vy = -Math.abs(this.vy);
                }
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // Add a highlight to make it look more 3D
                const gradient = ctx.createRadialGradient(
                    this.x - this.radius * 0.3, 
                    this.y - this.radius * 0.3, 
                    0,
                    this.x, 
                    this.y, 
                    this.radius
                );
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // Outline
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }
        
        function checkCollision(ball1, ball2) {
            const dx = ball2.x - ball1.x;
            const dy = ball2.y - ball1.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            return distance < ball1.radius + ball2.radius;
        }
        
        function resolveCollision(ball1, ball2) {
            // Calculate relative position
            const dx = ball2.x - ball1.x;
            const dy = ball2.y - ball1.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            // Prevent division by zero
            if (distance === 0) return;
            
            // Normal vector
            const nx = dx / distance;
            const ny = dy / distance;
            
            // Tangent vector
            const tx = -ny;
            const ty = nx;
            
            // Separate balls so they don't overlap
            const overlap = (ball1.radius + ball2.radius - distance) / 2;
            ball1.x -= overlap * nx;
            ball1.y -= overlap * ny;
            ball2.x += overlap * nx;
            ball2.y += overlap * ny;
            
            // Project velocities onto normal and tangent
            const v1n = ball1.vx * nx + ball1.vy * ny;
            const v1t = ball1.vx * tx + ball1.vy * ty;
            const v2n = ball2.vx * nx + ball2.vy * ny;
            const v2t = ball2.vx * tx + ball2.vy * ty;
            
            // Calculate new normal velocities using elastic collision formula
            const m1 = ball1.mass;
            const m2 = ball2.mass;
            
            const v1nNew = (v1n * (m1 - m2) + 2 * m2 * v2n) / (m1 + m2);
            const v2nNew = (v2n * (m2 - m1) + 2 * m1 * v1n) / (m1 + m2);
            
            // Tangent velocities remain unchanged
            const v1tNew = v1t;
            const v2tNew = v2t;
            
            // Convert back to x,y coordinates
            ball1.vx = v1nNew * nx + v1tNew * tx;
            ball1.vy = v1nNew * ny + v1tNew * ty;
            ball2.vx = v2nNew * nx + v2tNew * tx;
            ball2.vy = v2nNew * ny + v2tNew * ty;
        }
        
        function initBalls(count) {
            balls = [];
            const radius = 20;
            
            for (let i = 0; i < count; i++) {
                let x, y;
                let attempts = 0;
                
                // Find a position that doesn't overlap with existing balls
                do {
                    x = radius + Math.random() * (canvas.width - 2 * radius);
                    y = radius + Math.random() * (canvas.height - 2 * radius);
                    attempts++;
                } while (attempts < 100 && balls.some(ball => {
                    const dx = ball.x - x;
                    const dy = ball.y - y;
                    return Math.sqrt(dx * dx + dy * dy) < radius * 2 + 10;
                }));
                
                const speed = speedMultiplier;
                const angle = Math.random() * Math.PI * 2;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                
                balls.push(new Ball(x, y, vx, vy, radius, COLORS[i % COLORS.length]));
            }
        }
        
        function animate() {
            // Clear canvas
            ctx.fillStyle = '#0a4a2a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw balls
            for (let ball of balls) {
                ball.update();
                ball.draw();
            }
            
            // Check for collisions between balls
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    if (checkCollision(balls[i], balls[j])) {
                        resolveCollision(balls[i], balls[j]);
                    }
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        // Controls
        document.getElementById('ballCount').addEventListener('input', (e) => {
            const count = parseInt(e.target.value);
            document.getElementById('countVal').textContent = count;
            initBalls(count);
        });
        
        document.getElementById('speed').addEventListener('input', (e) => {
            const newSpeed = parseFloat(e.target.value);
            document.getElementById('speedVal').textContent = newSpeed;
            
            // Scale existing velocities
            const scaleFactor = newSpeed / speedMultiplier;
            for (let ball of balls) {
                ball.vx *= scaleFactor;
                ball.vy *= scaleFactor;
            }
            speedMultiplier = newSpeed;
        });
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            initBalls(balls.length);
        });
        
        // Click to add a ball
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const radius = 20;
            const speed = speedMultiplier;
            const angle = Math.random() * Math.PI * 2;
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;
            
            balls.push(new Ball(x, y, vx, vy, radius, COLORS[balls.length % COLORS.length]));
        });
        
        // Initialize and start
        initBalls(8);
        animate();
    </script>
</body>
</html>
